name: Compilar 19 APK pedagógicos C&F

on:
  push:
    branches: [ build-pedagogico-apk ]
    paths-ignore:
      - 'instaladores_pedagogicos/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reconstruir proyecto
        run: |
          cat proyecto_pedagogico.b64.part* | base64 -d > proyecto.zip
          rm -rf proyecto
          mkdir proyecto
          unzip -q proyecto.zip -d proyecto
          echo "Proyecto reconstruido"
          find proyecto -maxdepth 2 -type f | head
      - name: Compilar 19 APK
        working-directory: proyecto/Android_APK_PEDAGOGICO_LITE_CyF_02_2026
        run: gradle :app:assembleDebug --stacktrace
      - name: Reunir instaladores
        run: |
          rm -rf instaladores_pedagogicos
          mkdir -p instaladores_pedagogicos
          find proyecto/Android_APK_PEDAGOGICO_LITE_CyF_02_2026/app/build/outputs/apk -type f -name '*-debug.apk' -exec cp {} instaladores_pedagogicos/ \;
          echo "APK generados: $(find instaladores_pedagogicos -name '*.apk' | wc -l)"
          test "$(find instaladores_pedagogicos -name '*.apk' | wc -l)" -eq 19
      - name: Publicar APK en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- instaladores_pedagogicos/*.apk
          git commit -m "Publicar 19 APK pedagógicos con logo" || exit 0
          git push origin HEAD:build-pedagogico-apk
      - uses: actions/upload-artifact@v4
        with:
          name: APK-Pedagogicos-CyF-02-2026
          path: instaladores_pedagogicos/*.apk
          retention-days: 30
