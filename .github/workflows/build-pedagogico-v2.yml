name: Compilar 19 APK superdinámicos y pedagógicos C&F

on:
  push:
    branches: [ build-pedagogico-apk ]
    paths-ignore:
      - 'instaladores_pedagogicos_v2/**'
      - 'build_status_pedagogico_v2.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extraer proyecto v2
        run: |
          rm -rf proyecto_v2
          mkdir proyecto_v2
          unzip -q proyecto_pedagogico_v2.zip -d proyecto_v2
      - name: Compilar 19 APK v2
        working-directory: proyecto_v2
        run: gradle :app:assembleDebug --stacktrace
      - name: Reunir instaladores
        run: |
          rm -rf instaladores_pedagogicos_v2
          mkdir -p instaladores_pedagogicos_v2
          find proyecto_v2/app/build/outputs/apk -type f -name '*-debug.apk' -exec cp {} instaladores_pedagogicos_v2/ \;
          COUNT=$(find instaladores_pedagogicos_v2 -name '*.apk' | wc -l)
          echo "APK generados: $COUNT"
          test "$COUNT" -eq 19
          printf "SUCCESS\napk_count=%s\nversion=2.0.0\n" "$COUNT" > build_status_pedagogico_v2.txt
      - name: Publicar APK en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- instaladores_pedagogicos_v2/*.apk build_status_pedagogico_v2.txt
          git commit -m "Publicar 19 APK pedagógicos v2 con logo" || exit 0
          git push origin HEAD:build-pedagogico-apk
      - uses: actions/upload-artifact@v4
        with:
          name: APK-Superdinamicos-Pedagogicos-CyF-02-2026-v2
          path: instaladores_pedagogicos_v2/*.apk
          retention-days: 30
