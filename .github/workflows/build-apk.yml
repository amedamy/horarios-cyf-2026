name: Compilar 19 APK docentes v2 pedagógicos

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ build-android-apk ]
    paths-ignore:
      - 'instaladores_v2/**'
      - 'build_status_v2.txt'
      - 'build_v2.log'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK Android
        id: sdk
        continue-on-error: true
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" > sdk_v2.log 2>&1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extraer proyecto Android v2 final
        run: |
          rm -rf proyecto_v2
          mkdir proyecto_v2
          unzip -q proyecto_android_v2_final.zip -d proyecto_v2
      - name: Compilar APK v2
        shell: bash
        run: |
          set -o pipefail
          cd proyecto_v2
          gradle :app:assembleDebug --stacktrace 2>&1 | tee ../build_v2.log
      - name: Reunir y validar 19 instaladores
        shell: bash
        run: |
          rm -rf instaladores_v2
          mkdir -p instaladores_v2
          find proyecto_v2/app/build/outputs/apk -type f -name '*-debug.apk' -exec cp {} instaladores_v2/ \;
          COUNT=$(find instaladores_v2 -type f -name '*.apk' | wc -l)
          printf "SUCCESS\napk_count=%s\nversion=2.1.0\n" "$COUNT" > build_status_v2.txt
          ls -lh instaladores_v2
          test "$COUNT" -eq 19
      - name: Publicar resultado en rama de compilación
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- build_status_v2.txt build_v2.log instaladores_v2/*.apk
          git commit -m "Resultado compilación APK docentes v2.1" || exit 0
          git push origin HEAD:build-android-apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: APK-Docentes-CyF-02-2026-v2.1
          path: |
            instaladores_v2/*.apk
            build_status_v2.txt
            build_v2.log
          if-no-files-found: warn
          retention-days: 30
